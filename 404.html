<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>404 — Page Not Found | KumoHop</title>

  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />

  <meta
    name="description"
    content="The page you were looking for doesn't exist. Return to KumoHop."
  />

  <!-- Vercel Web Analytics -->
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>

  <style>
    :root {
      --bg: #f7f7f5;
      --surface: #ffffff;
      --text: #171717;
      --muted: #6b6b6b;
      --border: #ddddda;
      --accent: #171717;
      --orange: #ff5e3a;
      --blue: #2563eb;
      --surface-hover: #f0f0ed;
      --max-width: 1100px;
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
      padding-bottom: var(--safe-bottom);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(var(--max-width), calc(100% - 40px));
      margin: auto;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* =========================
       NAVIGATION
    ========================= */

    nav {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .nav-links a {
      padding: 6px 0;
      white-space: nowrap;
      transition: color 0.15s ease;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    /* =========================
       404 HERO / CONTENT
    ========================= */

    main {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 80px 0;
    }

    .error-content {
      max-width: 800px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      margin-bottom: 24px;
    }

    .eyebrow-dot {
      width: 8px;
      height: 8px;
      background: var(--orange);
      border-radius: 50%;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.5rem, 11vw, 9rem);
      line-height: 0.92;
      letter-spacing: -0.075em;
      font-weight: 700;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .error-description {
      max-width: 540px;
      margin-top: 32px;
      color: var(--muted);
      font-size: 1.15rem;
    }

    .actions {
      display: flex;
      gap: 14px;
      margin-top: 38px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 22px;
      border: 1px solid var(--text);
      font-size: 0.9rem;
      transition: 0.2s ease;
      cursor: pointer;
    }

    .button.primary {
      background: var(--text);
      color: var(--bg);
    }

    .button.primary:hover {
      background: #333333;
      border-color: #333333;
    }

    .button.secondary {
      border-color: var(--border);
      color: var(--muted);
    }

    .button.secondary:hover {
      border-color: var(--text);
      color: var(--text);
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      padding: 28px 0;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.8rem;
    }

    .footer-content {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    /* =========================
       MOBILE & RESPONSIVE
    ========================= */

    @media (max-width: 750px) {
      .container {
        width: min(100% - 32px, var(--max-width));
      }

      nav {
        height: 66px;
      }

      .brand img {
        width: 44px;
        height: 44px;
      }

      .brand-name {
        font-size: 1.05rem;
      }

      .nav-links {
        gap: 16px;
        font-size: 0.85rem;
      }

      .nav-links a {
        padding: 8px 4px;
      }

      main {
        padding: 50px 0;
      }

      .eyebrow {
        margin-bottom: 18px;
        font-size: 0.72rem;
        letter-spacing: 0.12em;
      }

      h1 {
        font-size: clamp(2.5rem, 11vw, 4.5rem);
        line-height: 0.96;
        letter-spacing: -0.055em;
      }

      .error-description {
        margin-top: 22px;
        font-size: 1.02rem;
        line-height: 1.55;
      }

      .actions {
        margin-top: 28px;
        gap: 12px;
      }

      footer {
        padding: 24px 0;
      }

      .footer-content {
        gap: 12px;
      }
    }

    @media (max-width: 480px) {
      .actions {
        flex-direction: column;
        width: 100%;
      }

      .actions .button {
        width: 100%;
        text-align: center;
        padding: 13px 20px;
      }

      .footer-content {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
    }

    @media (max-width: 380px) {
      .container {
        width: min(100% - 24px, var(--max-width));
      }

      nav {
        height: 60px;
      }

      .brand img {
        width: 36px;
        height: 36px;
      }

      .brand-name {
        font-size: 0.95rem;
      }

      .nav-links {
        gap: 10px;
        font-size: 0.78rem;
      }

      h1 {
        font-size: clamp(2.2rem, 10vw, 2.6rem);
      }

      .button {
        padding: 12px 16px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Navigation -->
    <nav>
      <a href="index.html" class="brand">
        <img src="logo.png" alt="KumoHop logo">
        <span class="brand-name">KumoHop</span>
      </a>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="index.html#projects">Projects</a>
        <a href="index.html#contact">Contact</a>
      </div>
    </nav>

    <!-- Main 404 Content -->
    <main>
      <div class="error-content">

        <div class="eyebrow">
          <span class="eyebrow-dot"></span>
          Error 404 • Page Not Found
        </div>

        <h1>Lost in the<br>clouds.</h1>

        <p class="error-description">
          The page you are looking for doesn’t exist, was moved, or vanished into thin air.
        </p>

        <div class="actions">
          <a href="index.html" class="button primary">
            Back to Home
          </a>
          <a href="index.html#projects" class="button secondary">
            Explore Projects
          </a>
        </div>

      </div>
    </main>

    <!-- Footer -->
    <footer>
      <div class="footer-content">
        <span>© 2026 KumoHop</span>
        <span>Keep hopping.</span>
      </div>
    </footer>

  </div>

</body>
</html>
